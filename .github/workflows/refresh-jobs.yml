name: Refresh jobs daily

on:
  schedule:
    - cron: "0 11 * * *" # 6/7am ET daily — jobs are fresh before fellows wake up
  workflow_dispatch: # manual "Refresh now" button in the Actions tab
    inputs:
      force_theirstack:
        description: "Force a TheirStack pull now (ignores the weekly cadence, re-pulls the full window)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build jobs.json
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          THEIRSTACK_API_KEY: ${{ secrets.THEIRSTACK_API_KEY }}
          THEIRSTACK_MONTHLY_CREDITS: ${{ vars.THEIRSTACK_MONTHLY_CREDITS }}
          THEIRSTACK_FORCE: ${{ inputs.force_theirstack }}
        run: npm run build

      - name: Send morning digest
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
          DIGEST_BCC: ${{ secrets.DIGEST_BCC }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: node scripts/digest.js

      - name: Commit updated jobs.json
        run: |
          git config user.name "ember-jobs-bot"
          git config user.email "actions@github.com"
          git add site/jobs.json data/theirstack-usage.json
          git diff --cached --quiet || git commit -m "chore: daily jobs refresh $(date -u +%F)"
          git push
